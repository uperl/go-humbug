openapi: 3.1.0
info: {title: Users, version: "1.0"}
servers: [{url: http://example.test}]
paths:
  /users:
    post:
      operationId: createUser
      parameters:
        - {name: X-Request-Id, in: header, required: true, schema: {type: string, minLength: 3}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewUser'}
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
  /contacts:
    post:
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/Email'}
                - {$ref: '#/components/schemas/Phone'}
      responses: {'204': {description: ok}}
  /contacts-any:
    post:
      operationId: createContactAny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - {$ref: '#/components/schemas/Email'}
                - {$ref: '#/components/schemas/Phone'}
      responses: {'204': {description: ok}}
  /overlap:
    post:
      operationId: createOverlap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {type: object}
                - {type: object, required: [email]}
      responses: {'204': {description: ok}}
  /addresses:
    post:
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: 'components.yaml#/components/schemas/Address'}
      responses: {'204': {description: ok}}
  /items:
    get:
      operationId: listItems
      parameters:
        - {name: session, in: cookie, required: true, schema: {type: string, minLength: 4}}
        - {name: ids, in: query, required: false, schema: {type: array, items: {type: integer}}}
      responses:
        '200':
          description: ok
          headers:
            X-Rate-Limit: {required: true, schema: {type: integer}}
            Set-Cookie: {required: false, schema: {type: string, pattern: '^sid='}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Email'}
                - type: object
                  required: [qty]
                  properties: {qty: {type: integer}}
      responses: {'204': {description: ok}}
  /upload:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses: {'204': {description: ok}}
  /notes:
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string, minLength: 3}
      responses: {'204': {description: ok}}
  /label/{id}:
    get:
      operationId: getLabel
      parameters:
        - {name: id, in: path, required: true, style: label, schema: {type: integer}}
      responses: {'204': {description: ok}}
  /matrix/{id}:
    get:
      operationId: getMatrix
      parameters:
        - {name: id, in: path, required: true, style: matrix, schema: {type: integer}}
      responses: {'204': {description: ok}}
  /list/{ids}:
    get:
      operationId: getList
      parameters:
        - name: ids
          in: path
          required: true
          style: simple
          schema: {type: array, items: {type: integer}}
      responses: {'204': {description: ok}}
  /both:
    post:
      operationId: bothSides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/Email'}
                - {$ref: '#/components/schemas/Phone'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: '#/components/schemas/Email'}
                  - {$ref: '#/components/schemas/Phone'}
  /vcl:
    put:
      operationId: putVcl
      requestBody:
        required: true
        content:
          application/vcl:
            schema: {type: string, minLength: 4}
      responses:
        '2XX':
          description: ok
          content:
            application/vcl:
              schema: {type: string, minLength: 1}
  /form:
    post:
      operationId: postForm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, properties: {a: {type: string}}}
      responses: {'204': {description: ok}}
  /anycsv:
    post:
      operationId: anyCsv
      requestBody:
        required: true
        content:
          text/csv: {}
      responses: {'204': {description: ok}}
  /wild:
    post:
      operationId: wild
      requestBody:
        required: true
        content:
          'text/*':
            schema: {type: string, maxLength: 5}
      responses: {'204': {description: ok}}
  /blob:
    post:
      operationId: blob
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 4}
      responses: {'204': {description: ok}}
  /hdr:
    get:
      operationId: headerCases
      parameters:
        - {name: X-Any, in: header, required: true, schema: {type: string}}
        - {name: X-Min, in: header, required: false, schema: {type: string, minLength: 3}}
        - {name: X-Opt, in: header, required: false, schema: {type: string}}
        - {name: X-Num, in: header, required: false, schema: {type: integer}}
        - {name: X-Tags, in: header, required: false, schema: {type: array, items: {type: string}}}
      responses:
        '200':
          description: ok
          headers:
            X-Rate-Limit: {required: true, schema: {type: integer}}
            X-Note: {required: false, schema: {type: string}}
  /exclusive:
    post:
      operationId: exclusive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Email'}
                - {$ref: '#/components/schemas/Phone'}
      responses: {'204': {description: ok}}
  /multipart:
    post:
      operationId: postMultipart
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, properties: {a: {type: string}}}
      responses: {'204': {description: ok}}
  /form-typed:
    post:
      operationId: postFormTyped
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
                age: {type: integer, minimum: 0}
                tags: {type: array, items: {type: string}}
      responses: {'204': {description: ok}}
  /xml:
    post:
      operationId: postXml
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              xml: {name: user}
              required: [name]
              properties:
                name: {type: string, minLength: 1}
                age: {type: integer, minimum: 0}
      responses:
        '200':
          description: ok
          content:
            application/xml:
              schema:
                type: object
                xml: {name: user}
                required: [name]
                properties:
                  name: {type: string, minLength: 1}
  /xml-unnamed:
    post:
      operationId: postXmlUnnamed
      requestBody:
        required: true
        content:
          application/xml:
            schema: {type: object, properties: {name: {type: string}}}
      responses: {'204': {description: ok}}
components:
  schemas:
    NewUser:
      type: object
      required: [name, age, profile]
      properties:
        name: {type: string, minLength: 1}
        age: {type: integer, minimum: 0}
        email: {type: string}
        profile:
          type: object
          required: [bio]
          properties: {bio: {type: string}}
    User:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
    Email:
      type: object
      required: [email]
      properties: {email: {type: string}}
      additionalProperties: false
    Phone:
      type: object
      required: [phone]
      properties: {phone: {type: string}}
      additionalProperties: false
